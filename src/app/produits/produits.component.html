<div class="container">
  <div class="card shadow mb-4">
    <div class="card-body">

      @if (erreur()) {
        <div class="alert alert-danger">{{ erreur() }}</div>
      }

      <table class="table table-striped">
        <thead>
          <tr>
            <th>Id</th>
            <th>Nom</th>
            <th>Prix</th>
            <th>Date Création</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          @for (produit of produits(); track produit.idProduit) {
            <tr>
              <td>{{ produit.idProduit }}</td>
              <td>{{ produit.nomProduit }}</td>
              <td>{{ produit.prixProduit }}</td>
              <td>{{ produit.dateCreation | date:'dd/MM/yyyy' }}</td>
              <td>
                <a class="btn btn-success me-2"
                   [routerLink]="['/updateProduit', produit.idProduit]">Modifier</a>
                <button type="button" class="btn btn-danger"
                        (click)="supprimerProduit(produit)">Supprimer</button>
              </td>
            </tr>
          } @empty {
            <tr><td colspan="5" class="text-center">Aucun produit</td></tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
