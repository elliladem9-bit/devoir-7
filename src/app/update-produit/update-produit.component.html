<div class="container">
  <h2>Modifier un Produit :</h2>

  <form (ngSubmit)="updateProduit()">
    <div class="col-sm-2">
      <label>ID Produit</label>
      <input readonly type="text" [value]="currentProduit.idProduit" name="idProduit"
             class="form-control">
    </div>

    <div class="col-sm-4">
      <label>Nom Produit</label>
      <input type="text" [(ngModel)]="currentProduit.nomProduit" name="nomProduit"
             class="form-control">
    </div>

    <div class="col-sm-2">
      <label>Prix Produit</label>
      <input type="number" [(ngModel)]="currentProduit.prixProduit" name="prixProduit"
             class="form-control">
    </div>

    <div class="col-sm-4">
      <label>Date création</label>
      <input type="date" [(ngModel)]="dateStr" name="dateCreation" class="form-control">
    </div>

    <div class="mt-2">
      <button type="submit" class="btn btn-success">Modifier</button>
    </div>
  </form>
</div>
